# Local development and smoke testing. Copy .env.example to .env and set API_KEY first.
# Generated outputs live in the named volume "media-output"; they survive container restarts but not volume removal.

services:
  media-processor:
    build:
      context: .
      dockerfile: Dockerfile
    image: crorso-media-processor:local
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      API_KEY: ${API_KEY:?Set API_KEY in .env - see .env.example}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      MAX_AUDIO_PARTS: ${MAX_AUDIO_PARTS:-200}
      MAX_AUDIO_DURATION_SECONDS: ${MAX_AUDIO_DURATION_SECONDS:-7200}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-900}
      OUTPUT_RETENTION_HOURS: ${OUTPUT_RETENTION_HOURS:-24}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - media-output:/data/output
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  media-output:
